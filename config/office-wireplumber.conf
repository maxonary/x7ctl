monitor.alsa.rules = [
  { matches = [ { device.name = "~alsa_card.usb-Creative.*Sound_Blaster_X7.*" } ]
    actions = { update-props = {
      api.alsa.soft-mixer = true
      api.alsa.disable-mixer-path = true
    } }
  }
  { matches = [ { node.name = "~alsa_output.usb-Creative.*Sound_Blaster_X7.*" } ]
    actions = { update-props = {
      node.name = "office.x7"
      node.description = "Office X7 output"
      api.alsa.soft-mixer = true
      audio.format = "S24_3LE"
      audio.rate = 48000
      audio.channels = 2
      priority.driver = 5000
    } }
  }
  { matches = [ { node.name = "~alsa_input.platform-fe980000.*" } ]
    actions = { update-props = {
      priority.driver = 1
    } }
  }
]
