context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Office Equalizer"
      media.name = "Office Equalizer"
      filter.graph = {
        nodes = [
          { type = builtin name = bass label = bq_lowshelf
            control = { Freq = 120.0 Q = 0.707 Gain = 0.0 } }
          { type = builtin name = mid label = bq_peaking
            control = { Freq = 1500.0 Q = 0.707 Gain = 0.0 } }
          { type = builtin name = treble label = bq_highshelf
            control = { Freq = 6000.0 Q = 0.707 Gain = 0.0 } }
        ]
        links = [
          { output = "bass:Out" input = "mid:In" }
          { output = "mid:Out" input = "treble:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "office.eq"
        media.class = Audio/Sink
        priority.session = 2000
      }
      playback.props = {
        node.name = "office.eq.output"
        node.passive = true
        target.object = "office.x7"
      }
    }
  }
]
